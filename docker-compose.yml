version: '3.8'

services:
  # Servicio PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexus2026
      POSTGRES_DB: nexus_games
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_games"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Backend (Node.js + Express + PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:nexus2026@postgres:5432/nexus_games
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=nexus2026
      - DB_NAME=nexus_games
      - DB_SSL=false
      - JWT_SECRET=NexusGamesSuperSecretKeyJwt2026SecureProductionToken
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus_network

  # Servicio Frontend (React 19 + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: nexus_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nexus_network

volumes:
  postgres_data:
    driver: local

networks:
  nexus_network:
    driver: bridge
